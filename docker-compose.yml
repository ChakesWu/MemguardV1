services:
  keycloak:
    image: quay.io/keycloak/keycloak:26.1.2
    command: start-dev --import-realm --hostname=http://localhost:${KEYCLOAK_PORT:-8180}
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KEYCLOAK_ADMIN_USERNAME:-admin}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:-admin}
      KC_HEALTH_ENABLED: "true"
    volumes:
      - ./keycloak/realm-export.json:/opt/keycloak/data/import/realm-export.json:ro
    ports:
      - "${KEYCLOAK_PORT:-8180}:8080"

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: memguard
      POSTGRES_USER: memguard
      POSTGRES_PASSWORD: memguard
    volumes:
      - memguard-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U memguard -d memguard"]
      interval: 5s
      timeout: 5s
      retries: 10

  agent-server:
    build:
      context: ./agent-server
    environment:
      DATABASE_URL: postgresql://memguard:memguard@postgres:5432/memguard
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY:-}
      DEEPSEEK_MODEL: ${DEEPSEEK_MODEL:-deepseek-v4-flash}
      LANGSMITH_TRACING: ${LANGSMITH_TRACING:-false}
      LANGSMITH_API_KEY: ${LANGSMITH_API_KEY:-}
      LANGSMITH_PROJECT: ${LANGSMITH_PROJECT:-memguard-customer-support-baseline}
    depends_on:
      postgres:
        condition: service_healthy
    expose:
      - "2024"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:2024/info')"]
      interval: 10s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./backend
    environment:
      DATABASE_URL: postgresql://memguard:memguard@postgres:5432/memguard
      MEMGUARD_OIDC_ISSUER: http://localhost:${KEYCLOAK_PORT:-8180}/realms/memguard
      MEMGUARD_OIDC_JWKS_URL: http://keycloak:8080/realms/memguard/protocol/openid-connect/certs
      MEMGUARD_OIDC_AUDIENCE: memguard-api
      MEMGUARD_CORS_ORIGINS: http://localhost:3001
      LANGGRAPH_AGENT_URL: http://agent-server:2024
    depends_on:
      postgres:
        condition: service_healthy
      keycloak:
        condition: service_started
      agent-server:
        condition: service_healthy
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 10s
      timeout: 5s
      retries: 5

  frontend:
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_API_URL: http://localhost:8000
        MEMGUARD_BACKEND_URL: http://backend:8000
        NEXT_PUBLIC_KEYCLOAK_URL: http://localhost:${KEYCLOAK_PORT:-8180}
        NEXT_PUBLIC_KEYCLOAK_REALM: memguard
        NEXT_PUBLIC_KEYCLOAK_CLIENT_ID: memguard-frontend
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "3001:3000"

volumes:
  memguard-postgres:
